name: simple_plate
description: "PlateSimple — fast, clean calorie and macro tracker by ZiBa Entertainment."
publish_to: 'none'

version: 2.1.0+37

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Analytics for user acquisition (see the ZiBa Firebase UA rollout) plus
  # crash reporting. Analytics is what lets the Google Ads campaigns optimise
  # toward people who actually log food, rather than toward raw installs.
  firebase_core: ^4.2.1
  firebase_analytics: ^12.4.6
  firebase_crashlytics: ^5.2.7
  # Server-tunable ad frequency + A/B tests without shipping a build.
  firebase_remote_config: ^6.0.4

  # State
  provider: ^6.1.5+1

  # UI (Rubik is bundled under assets/fonts, see the fonts section below)

  # Persistence
  shared_preferences: ^2.3.2
  # Direct import for SharedPreferencesAsyncAndroidOptions: reading the IAB
  # consent keys UMP writes to the default prefs file (mediation_consent.dart).
  shared_preferences_android: ^2.4.0

  # Food database (Open Food Facts)
  http: ^1.2.2

  # Barcode scanning
  mobile_scanner: ^7.0.0

  # Notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^3.0.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1

  # Ads
  google_mobile_ads: ^9.1.0
  # iOS App Tracking Transparency prompt, asked after UMP consent and before
  # the first ad request (ConsentGate).
  app_tracking_transparency: ^2.0.7
  # AdMob bidding partners (docs/ADMOB_BIDDING_SETUP.md): Unity Ads and
  # Liftoff Monetize. Each adapter release pins one google_mobile_ads major,
  # so bump all three together (same set as the other ZiBa apps).
  gma_mediation_liftoffmonetize: ^1.5.5
  gma_mediation_unity: ^1.11.1

  # IAP
  in_app_purchase: ^3.2.0
  # Read directly to tell an unpaid (pending) Play purchase from a paid one.
  in_app_purchase_android: ^0.5.0
  # Read directly to spot an App Store free-trial offer.
  in_app_purchase_storekit: ^0.4.10

  # Links
  url_launcher: ^6.3.1

  # Sharing / export
  share_plus: ^13.3.1
  path_provider: ^2.1.5
  csv: ^6.0.0

  # App store review prompt
  in_app_review: ^2.0.10

  # Health integration
  health: ^13.3.1

  # Home screen widget
  home_widget: ^0.7.0

  # SQLite database
  drift: ^2.21.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.0
  app_settings: 5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  build_runner: ^2.4.14
  drift_dev: ^2.21.0
  # Tests feed fake Play purchases through a fake store.
  in_app_purchase_platform_interface: ^1.4.0
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  # Icon A (Sprout on the plate). The res/ and AppIcon files are generated by
  # store_assets/v2/icon/make_app_icon.py; these sources match it if this tool
  # is ever re-run (no inset: the foreground is a full 108dp layer).
  image_path: "assets/icon/icon.png"
  min_sdk_android: 26
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/icon_monochrome.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true
  generate: true

  assets:
    - assets/icon/icon.png
    - assets/promo/
    - assets/fonts/Rubik-OFL.txt

  # Rubik (SIL OFL 1.1, assets/fonts/Rubik-OFL.txt): the UI face. Bundled
  # rather than fetched at runtime so it works offline and on first launch.
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
